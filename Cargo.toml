[package]
name = "avian-ground-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Loopback-only read-only bridge for the AVIAN ground dashboard"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
